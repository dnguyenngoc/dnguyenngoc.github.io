baseURL = "https://duynguyenngoc.com/"
title = "Duy Nguyen - Senior Data Engineer"
theme = "wisdom"
languageCode = "en-us"
enableRobotsTXT = true
encoding = "UTF-8"
googleAnalytics = ''
enableGitInfo = true
enableEmoji = true
enableInlineShortcodes = true

[params]
  author = "Duy Nguyen"
  description = "Senior Data Engineer at VieON. Blog about data engineering, AI, big data, and technology."
  latestPostsLimit = 10
  hideReadingTime = false
  hideAuthor = false
  keywords = [ "data engineering", "AI", "big data", "technology", "programming", "machine learning", "apache spark", "kubernetes" ]
  
  # Social links
  github = "https://github.com/dnguyenngoc"
  linkedin = "https://www.linkedin.com/in/dnguyenngoc/"
  email = "duynguyenngoc@hotmail.com"
  
  # SEO
  twitter = "@dnguyenngoc"
  og_image = "/avatar.jpeg"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  definitionList = true
  footnote = true
  linkify = true
  strikethrough = true
  table = true
  taskList = true
  typographer = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats]
  [outputFormats.JSON]
    baseName = "index"
    isPlainText = true
    mediaType = "application/json"
    notAlternative = true

[menu]
[[menu.main]]
  identifier = 'home'
  name = 'Home/'
  url = '/'
  weight = 1
[[menu.main]]
  identifier = 'posts'
  name = 'Posts/'
  url = '/posts/'
  weight = 2
[[menu.main]]
  identifier = 'cv'
  name = 'Cv/'
  url = '/pdf-cv/duynguyen-cv.pdf'
  weight = 3
[[menu.main]]
  identifier = 'de'
  name = 'De/'
  url = '/de/'
  weight = 4
[[menu.main]]
  identifier = 'games'
  name = 'Games/'
  url = '/game/'
